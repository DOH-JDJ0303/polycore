<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>PolyCore pipeline</title>
<desc>Top-down flowchart of the PolyCore pipeline: load sequences and identify the reference genome, determine ploidy, mask invalid sites, calculate genome fraction, filter samples with low genome fraction, find the core genome, find constant sites, find pairwise differences, and write outputs.</desc>

<style>
@media (prefers-color-scheme: dark) {
  .gray rect { fill: #444441; stroke: #B4B2A9; }
  .gray .t { fill: #D3D1C7; } .gray .s { fill: #B4B2A9; }
  .teal rect { fill: #085041; stroke: #5DCAA5; }
  .teal .t { fill: #9FE1CB; } .teal .s { fill: #5DCAA5; }
  .arr, #arrow path { stroke: #9c9a92; }
}
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="gray">
  <rect x="190" y="40" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="340" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Load sequences</text>
  <text class="s" x="340" y="81" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">identify reference genome</text>
</g>
<line class="arr" x1="340" y1="98" x2="340" y2="120" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="190" y="124" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="143" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Determine ploidy</text>
  <text class="s" x="340" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">user set or from IUPAC codes</text>
</g>
<line class="arr" x1="340" y1="182" x2="340" y2="204" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="190" y="208" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Mask invalid sites</text>
</g>
<line class="arr" x1="340" y1="254" x2="340" y2="276" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="190" y="280" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="299" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Calculate genome fraction</text>
  <text class="s" x="340" y="321" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">sample valid / ref valid</text>
</g>
<line class="arr" x1="340" y1="338" x2="340" y2="360" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="190" y="364" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="383" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Filter samples</text>
  <text class="s" x="340" y="405" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">low genome fraction</text>
</g>
<line class="arr" x1="340" y1="422" x2="340" y2="444" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="190" y="448" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="467" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Find core genome</text>
  <text class="s" x="340" y="489" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">user-defined (default: 0.9)</text>
</g>
<line class="arr" x1="340" y1="506" x2="340" y2="528" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="190" y="532" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="554" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Find constant sites</text>
</g>
<line class="arr" x1="340" y1="578" x2="340" y2="600" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="190" y="604" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t" x="340" y="626" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Find pairwise differences</text>
</g>
<line class="arr" x1="340" y1="650" x2="340" y2="672" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="gray">
  <rect x="190" y="676" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="t" x="340" y="698" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Write outputs</text>
</g>
</svg>
